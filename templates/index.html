<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="google-site-verification" content="0stxOWg1TMKDkmqTsYg738xNMIYMd05xJVFwp4M6XB0" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Tanques de Agua</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f4f8;
            color: #333;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            color: #0077b6;
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        header p {
            color: #6c757d;
            font-size: 1.1rem;
        }

        .contenedor-tanques {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .tarjeta {
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            width: 320px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .tarjeta:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .tarjeta img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
        }

        .info h2 {
            font-size: 1.3rem;
            color: #023e8a;
        }

        .capacidad {
            align-self: flex-start;
            background-color: #e0f2fe;
            color: #0369a1;
            font-size: 0.85rem;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .info p {
            color: #555;
            font-size: 0.95rem;
            line-height: 1.4;
            flex-grow: 1;
        }

        /* Estilo del botón de WhatsApp */
        .btn-whatsapp {
            display: block;
            text-align: center;
            background-color: #25d366;
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 10px;
            border-radius: 8px;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-whatsapp:hover {
            background-color: #1eb854;
        }
    </style>
</head>
<body>

    <header>
        <h1>Catálogo de Tanques de Agua</h1>
        <p>Soluciones de almacenamiento de alta calidad</p>
    </header>

    <div class="contenedor-tanques">
        
        <!-- Tarjeta 1 -->
        <div class="tarjeta">
            <img src="/static/tanque1.jpg" alt="Tanque de agua">
            <div class="info">
                <span class="capacidad">1,000 Litros</span>
                <h2>Tanque Cilíndrico Vertical</h2>
                <p>Fabricado en polietileno de alta densidad. Ideal para residencias y espacios reducidos.</p>
                
                <!-- Botón de WhatsApp (Cambia el número de teléfono con tu código de país) -->
                <a href="https://wa.me/584127321067?text=Hola,%20me%20interesa%20el%20Tanque%20Cilíndrico%20de%201000L" 
                   target="_blank" 
                   class="btn-whatsapp">
                   Consultar por WhatsApp
                </a>
            </div>
        </div>

    </div>

</body>
</html>
